<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ロゴとアイコン</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;color:#1d2a44}
.r{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800}
</style>
<div style="width: 1600px; height: 900px; box-sizing: border-box; padding: 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; background: #eef2f8">
  <div style="border-radius: 28px; background: linear-gradient(160deg, #dcefff, #ffe3ec); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative">
    <span class="r" style="position: absolute; left: 24px; top: 18px; font-size: 14px; color: #6b7894">ロゴ（明るい背景）</span>
    <img src="../../Assets/Art/UI/Logo/wordmark.png" alt="PatchWork Secure" style="width: 620px; height: 238px">
    <span class="r" style="font-size: 34px">情シスの一年</span>
  </div>
  <div style="border-radius: 28px; background: #1b2340; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative">
    <span class="r" style="position: absolute; left: 24px; top: 18px; font-size: 14px; color: #9aa5ba">ロゴ（暗い背景・事件画面など）</span>
    <img src="../../Assets/Art/UI/Logo/wordmark.png" alt="PatchWork Secure" style="width: 620px; height: 238px">
    <span class="r" style="font-size: 34px; color: #ffffff">情シスの一年</span>
  </div>
  <div style="border-radius: 28px; background: #ffffff; display: flex; align-items: center; justify-content: center; gap: 40px; position: relative">
    <span class="r" style="position: absolute; left: 24px; top: 18px; font-size: 14px; color: #6b7894">アプリアイコン（Steam・ウィンドウ用）</span>
    <img src="../../Assets/Art/UI/Logo/icon.png" alt="アイコン 256" style="width: 256px; height: 256px">
    <img src="../../Assets/Art/UI/Logo/icon.png" alt="アイコン 128" style="width: 128px; height: 128px">
    <img src="../../Assets/Art/UI/Logo/icon.png" alt="アイコン 64" style="width: 64px; height: 64px">
    <img src="../../Assets/Art/UI/Logo/icon.png" alt="アイコン 32" style="width: 32px; height: 32px">
  </div>
  <div style="border-radius: 28px; background: linear-gradient(160deg, #dcefff, #ffe3ec); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; position: relative">
    <span class="r" style="position: absolute; left: 24px; top: 18px; font-size: 14px; color: #6b7894">画面内の小さい表示</span>
    <div style="display: flex; align-items: center; gap: 14px; background: #ffffff; border-radius: 20px; padding: 10px 22px 10px 12px; box-shadow: 0 0 0 3px #ffffff, 0 0 0 4px #dfe5ef, 0 10px 24px rgba(27,35,64,.15)">
      <img src="../../Assets/Art/UI/Logo/icon.png" alt="" style="width: 64px; height: 64px">
      <img src="../../Assets/Art/UI/Logo/wordmark.png" alt="PatchWork Secure" style="width: 240px; height: 92px">
    </div>
    <span class="r" style="font-size: 15px; color: #52607a">タイトル：大きいロゴ＋アイコン／各画面：左上にアイコン、年間評価はロゴ</span>
  </div>
</div>
</body>
</html>
