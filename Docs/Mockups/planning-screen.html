.blink{animation:blink 1.1s steps(2) infinite}
.petal{position:absolute;top:0;width:14px;height:10px;border-radius:10px 0 10px 0;background:#ffc4d6;animation:fall linear infinite}
.shine{position:absolute;top:0;width:30%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.8s ease-in-out infinite}
