<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>試作G 復旧の順番</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 試作G（事件：障害・データ消失）：止まったシステムを、依存関係の順に立ち上げる。売上に直結する業務から早く戻すほど高得点 */
:root{--pink:#ff6f91;--pinkd:#d94a70;--navy:#1d2a44;--blue:#3fa9f5;--red:#e0405f;--green:#2bb673;--gray:#6b7894;--gold:#ffc02e}
*{box-sizing:border-box}
body{margin:0;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--navy);background:linear-gradient(160deg,#1d2a44,#24394f);min-height:100vh;overflow:hidden}
body::before{content:'';position:fixed;inset:-50%;background:repeating-linear-gradient(90deg,rgba(95,211,155,.05) 0 1px,transparent 1px 48px),repeating-linear-gradient(0deg,rgba(95,211,155,.05) 0 1px,transparent 1px 48px);animation:grid 30s linear infinite;pointer-events:none}
@keyframes grid{to{transform:translate(48px,48px)}}
.r{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800}
#app{width:1280px;height:760px;position:absolute;left:0;top:0;transform-origin:0 0}
.panel{background:rgba(255,255,255,.95);border-radius:22px;box-shadow:0 0 0 3px #fff,0 12px 30px rgba(0,0,0,.3)}
.top{position:absolute;left:0;right:0;top:0;height:72px;display:flex;align-items:center;gap:16px;padding:0 20px}
.badge{background:linear-gradient(180deg,#5fd39b,var(--green));color:#fff;border-radius:16px;padding:6px 16px;font-size:24px;box-shadow:0 5px 0 #1d8a55}
.clock{font-size:26px;background:var(--navy);color:#fff;border-radius:12px;padding:4px 14px;min-width:150px;text-align:center}
.loss{font-size:20px}
.map{position:absolute;left:0;top:92px;width:900px;height:654px;border-radius:22px;background:rgba(15,23,42,.75);box-shadow:0 0 0 3px #fff,0 12px 30px rgba(0,0,0,.35);overflow:hidden}
#wires{position:absolute;inset:0;pointer-events:none}
#wires line{stroke:rgba(159,179,214,.35);stroke-width:3;stroke-dasharray:6 6}
#wires line.live{stroke:#5fd39b;stroke-dasharray:none;filter:drop-shadow(0 0 5px #5fd39b);animation:flow 1s linear infinite}
#wires line.need{stroke:#ffc02e;stroke-width:4;stroke-dasharray:none;animation:needp .5s ease-in-out 3}
@keyframes needp{50%{stroke:#fff}}
.node{position:absolute;width:196px;height:116px;border-radius:18px;background:#2b3a55;color:#cfe0ff;padding:10px 12px;cursor:pointer;transform:translate(-50%,-50%);box-shadow:0 5px 0 #0f172a;transition:background .25s,transform .12s}
.node:hover{transform:translate(-50%,-52%)}
.node h4{margin:0;font-size:16px}
.node .sub{font-size:12px;opacity:.8;margin-top:2px}
.node .lamp{position:absolute;right:10px;top:10px;width:14px;height:14px;border-radius:7px;background:#e0405f;box-shadow:0 0 10px #e0405f;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.node.biz{border:3px solid #ffc02e}
.node.biz .money{position:absolute;left:12px;bottom:8px;font-size:12px;color:#ffe38a}
.node.busy{background:#34507a}
.node.busy .bar{position:absolute;left:10px;right:10px;bottom:8px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.node.busy .bar i{display:block;height:100%;background:#7fd0ff}
.node.up{background:linear-gradient(180deg,#5fd39b,#2bb673);color:#fff;cursor:default}
.node.up .lamp{background:#fff;box-shadow:0 0 12px #fff;animation:none}
.node.fail{animation:no .4s}
@keyframes no{25%{transform:translate(-54%,-50%)}75%{transform:translate(-46%,-50%)}}
.side{position:absolute;left:920px;top:92px;width:360px;height:654px;padding:18px}
.side h3{margin:0 0 8px;font-size:17px}
.crew{display:flex;gap:8px;margin-bottom:10px}.crew span{flex:1;border-radius:10px;padding:6px;text-align:center;font-size:13px;background:#e3f7ea}.crew span.work{background:#dff1ff}
.log{font-size:13px;display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto}.log div{border-radius:8px;padding:5px 8px;background:#f3f6fb}
.say{background:#fff;border-radius:16px;padding:10px 12px;font-size:15px;font-weight:700;box-shadow:0 0 0 3px #ffd3de;margin-top:12px;min-height:64px;width:240px}
.hin{position:absolute;right:6px;bottom:6px;height:230px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.ringfx{position:absolute;border-radius:24px;border:4px solid #fff;pointer-events:none;transform:translate(-50%,-50%);animation:ringfx .5s ease-out forwards;z-index:5}
@keyframes ringfx{0%{width:196px;height:116px;opacity:1}100%{width:260px;height:170px;opacity:0}}
.modal{position:absolute;inset:0;background:rgba(10,15,30,.55);display:none;align-items:center;justify-content:center;z-index:30}
.modal.on{display:flex}.modal .box{width:700px;padding:26px}
.prep label{display:flex;align-items:center;gap:8px;font-size:15px;padding:6px 0}
button{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;border:0;border-radius:18px;cursor:pointer;font-size:20px;padding:14px;color:#fff;background:linear-gradient(180deg,#5fd39b,var(--green));box-shadow:0 5px 0 #1d8a55;width:100%}
button:active{transform:translateY(3px)}
.scen{font-size:18px;background:#fff4d6;color:#8a5a00;border-radius:12px;padding:4px 12px}
.node.biz .money{display:flex;gap:6px;align-items:center;white-space:nowrap}
.node .work{font-size:12px;opacity:.85;margin-top:1px}
.rto{background:rgba(255,255,255,.14);color:#fff;border-radius:6px;padding:0 6px}
.rto.over{background:var(--red);animation:blink .6s infinite}
.node.enc{background:#4a2438;color:#ffd0da}
.node.enc .tag{position:absolute;left:12px;top:-12px;font-size:11px;background:var(--red);color:#fff;border-radius:6px;padding:1px 6px}
.node.chk{background:#2f3f2a;color:#e9ffd9;border:3px dashed #9be07a}
#wires line.safe{stroke:#9be07a;stroke-dasharray:3 5}
.crew span.away{background:#eef0f4;color:#9aa3b5}
.rtot{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.rtot th{text-align:left;color:var(--gray);font-weight:700;border-bottom:2px solid #e6ebf3;padding:4px}.rtot td{padding:4px;border-bottom:1px solid #eef1f6}
.maxim{font-size:22px;color:var(--pinkd);background:#fff0f4;border-radius:14px;padding:8px 14px;margin:6px 0;text-align:center}
button.sub2{background:linear-gradient(180deg,#7fc4ff,var(--blue));box-shadow:0 5px 0 #1f7fc4}
</style>
</head>
<body>
<div id="app">
  <div class="top panel"><div class="badge r">復旧の順番</div><div class="clock r" id="clock">停止 0:00</div><div class="scen r" id="scen">停電</div><div style="flex:1;font-size:14px;color:var(--gray)" id="desc">停電のあと、社内のシステムが全部止まった。</div><div class="loss r">業務の損失 <span id="loss" style="color:var(--red)">0</span> 万円</div></div>
  <div class="map" id="map"><svg id="wires" width="900" height="654"></svg></div>
  <div class="side panel"><h3 class="r">作業できる人</h3><div class="crew" id="crew"></div><h3 class="r">記録</h3><div class="log" id="log"></div><div class="say" id="say">…</div><img class="hin" id="hin" src="../../ArtSource/Hinata/gen-20260929/cut/pose_typing.png" alt="ひなた"></div>
  <div class="modal" id="modal"><div class="box panel" id="modalBox"></div></div>
</div>
<script>
// 依存関係：needが全部動いていないと立ち上がらない。bizは止まっている間、1時間ごとに損失が出る
// 毎回かわるもの：事故の種類（止まる範囲）、作業時間、業務の損失、2人目が合流する時刻、月末かどうか
const BASE=[
 {id:'check',name:'安全確認',sub:'復元元と侵入経路の点検',x:150,y:90,need:[],t:[1,2]},
 {id:'net',name:'社内ネットワーク',sub:'スイッチ・ルーター',x:450,y:90,need:[],t:[1,1]},
 {id:'dns',name:'名前解決（DNS）',sub:'住所録のような仕組み',x:230,y:230,need:['net'],t:[1,1]},
 {id:'auth',name:'認証サーバー',sub:'ログインの受付',x:670,y:230,need:['net'],t:[1,2]},
 {id:'fs',name:'ファイル共有',sub:'共有フォルダ',x:120,y:400,need:['dns','auth'],t:[1,3]},
 {id:'db',name:'データベース',sub:'受注・在庫の記録',x:450,y:380,need:['net'],t:[2,3]},
 {id:'mail',name:'メール',sub:'社外との連絡',x:780,y:400,need:['dns','auth'],t:[1,2],biz:[1,3]},
 {id:'order',name:'受注システム',sub:'注文の受付',x:330,y:560,need:['db','auth','dns'],t:[1,2],biz:[4,7]},
 {id:'acct',name:'会計システム',sub:'請求・支払い',x:620,y:560,need:['db','auth'],t:[1,2],biz:[2,4]},
];
const SCEN={
 power:{title:'停電',desc:'停電のあと、社内のシステムが全部止まった。支えている仕組みから順に立ち上げる。',down:['net','dns','auth','fs','db','mail','order','acct']},
 storage:{title:'保存領域の故障',desc:'保存領域が壊れ、データを使う仕組みが止まった。データベースはバックアップから戻すので時間がかかる。',down:['fs','db','order','acct'],slow:{db:1}},
 change:{title:'更新トラブル',desc:'夜間の更新で認証サーバーが起動しなくなった。ログインが必要な仕組みが止まっている。',down:['auth','fs','mail','order','acct']},
 ransom:{title:'ランサムウェア',desc:'ファイル共有とデータベースが暗号化された。戻す前に、復元元に感染が残っていないか確かめる。',down:['check','fs','db','mail','order','acct'],enc:['fs','db']},
};
const WHO=['ひなた','大野さん'];
let G,tid,ac,rng=Math.random,NODES=[];
function seeded(n){return function(){n|=0;n=n+0x6D2B79F5|0;let t=Math.imul(n^n>>>15,1|n);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ri(a,b){return a+Math.floor(rng()*(b-a+1))}
function node(id){return NODES.find(n=>n.id===id)}
// 暗号化されたものは、安全確認が済むまで戻しても再び暗号化される（手順書があれば線で見える）
function needs(n){return n.need.concat(G.scen.enc&&G.scen.enc.includes(n.id)?['check']:[])}
function generate(key){const keys=Object.keys(SCEN);G.key=key||keys[ri(0,keys.length-1)];G.scen=SCEN[G.key];
  G.monthEnd=rng()<.35;G.late=rng()<.3?1:0;
  NODES=BASE.filter(b=>b.id!=='check'||G.scen.down.includes('check')).map(b=>{const n={...b,t:ri(b.t[0],b.t[1])+((G.scen.slow||{})[b.id]||0)};if(b.biz)n.biz=ri(b.biz[0],b.biz[1])*(G.monthEnd&&b.id==='acct'?2:1);return n});
  G.up={};for(const n of NODES)if(!G.scen.down.includes(n.id))G.up[n.id]=true;
  // 最善の順番を先に求め、目標復旧時間（RTO）はそこから必ず達成できる値にする
  const best=search();G.best=best.loss;for(const n of NODES)if(n.biz&&!G.up[n.id])n.rto=Math.ceil((best.fin[n.id]+(rng()<.5?.5:1))*2)/2}
function simulate(order){const up={...G.up},busy={},fin={};const free=[0,G.late];let h=0,loss=0,guard=0;
  while(NODES.some(n=>!up[n.id])&&guard++<200){
    for(let w=0;w<2;w++){if(free[w]>h||Object.values(busy).some(b=>b.w===w))continue;const n=order.find(n=>!up[n.id]&&!busy[n.id]&&needs(n).every(d=>up[d]));if(n)busy[n.id]={left:n.t,w}}
    h+=.5;for(const n of NODES)if(n.biz&&!up[n.id])loss+=n.biz*.5;
    for(const id in busy){busy[id].left-=.5;if(busy[id].left<=0){up[id]=true;fin[id]=h;delete busy[id]}}}
  return {loss,fin}}
function search(){const down=NODES.filter(n=>!G.up[n.id]);let best=null,count=0;
  (function rec(order,left){if(count>6000)return;if(!left.length){count++;const r=simulate(order);if(!best||r.loss<best.loss)best=r;return}
    for(const n of left)if(needs(n).every(d=>G.up[d]||order.includes(node(d))))rec(order.concat(n),left.filter(x=>x!==n))})([],down);
  return best}
function start(daily,key){if(typeof daily!=='boolean')daily=false;rng=daily?seeded(+new Date().toISOString().slice(0,10).replace(/-/g,'')+7):(key?rng:Math.random);
  G={daily,hour:0,loss:0,runbook:document.getElementById('pRun').checked,crew:[null,null],busy:{},over:false,fails:0,reinf:0};generate(key);rng=Math.random;
  closeModal();document.getElementById('scen').textContent=G.scen.title+(G.daily?'（今日の一問）':'');document.getElementById('desc').textContent=G.scen.desc;
  document.getElementById('log').innerHTML='';draw();
  if(G.monthEnd)log('今日は月末。会計システムの損失が2倍','#fff4d6');if(G.late)log('大野さんは移動中。1時間後に合流','#f3f6fb');
  say(G.key==='ransom'?'戻す前に、まず安全確認！　汚れたまま戻すと、また暗号化されちゃう':'止まった順番じゃなくて、支えている仕組みから戻すよ！',G.key==='ransom'?'pose_magnifier':'pose_typing');
  clearInterval(tid);tid=setInterval(tick,1000)}
function line(a,n,cls){const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',n.x);l.setAttribute('y2',n.y);l.dataset.k=a.id+'-'+n.id;if(cls)l.classList.add(cls);document.getElementById('wires').appendChild(l);return l}
function draw(){const m=document.getElementById('map');m.querySelectorAll('.node').forEach(e=>e.remove());document.getElementById('wires').innerHTML='';
  if(G.runbook)for(const n of NODES)for(const d of needs(n))line(node(d),n,d==='check'?'safe':'');
  for(const n of NODES){const e=document.createElement('div');const enc=G.scen.enc&&G.scen.enc.includes(n.id);e.className='node'+(n.biz?' biz':'')+(enc?' enc':'')+(n.id==='check'?' chk':'');e.id='n-'+n.id;e.style.left=n.x+'px';e.style.top=n.y+'px';
    e.innerHTML=`<span class="lamp"></span><h4 class="r">${n.name}</h4><div class="sub">${n.sub}</div><div class="work">作業 ${n.t}時間</div>${n.biz?`<div class="money r">1時間 ${n.biz}万円${n.rto?`<span class="rto">目標 ${n.rto}時間</span>`:''}</div>`:''}${enc?'<div class="tag r">暗号化</div>':''}`;
    e.onclick=()=>boot(n);m.appendChild(e)}
  document.querySelectorAll('#wires line').forEach(l=>{if(l.dataset.k.split('-').every(k=>G.up[k]))l.classList.add('live')});
  render()}
function crew(){document.getElementById('crew').innerHTML=G.crew.map((c,i)=>{const away=i===1&&G.hour<G.late;return `<span class="${c?'work':away?'away':''}">${WHO[i]}<br><b>${c?node(c).name.replace('（DNS）','').slice(0,8):away?'移動中':'待機中'}</b></span>`}).join('')}
function boot(n){if(G.over||G.up[n.id]||G.busy[n.id])return;const free=G.crew.findIndex((c,i)=>c===null&&!(i===1&&G.hour<G.late));if(free<0){say('手の空いている人がいないよ。終わるまで待ってね','pose_think');beep(300,0,'square');return}
  const miss=n.need.filter(d=>!G.up[d]);
  if(miss.length){G.fails++;G.hour+=.5;accrue();beep(180,0,'sawtooth');shake(n);
    const names=miss.map(d=>node(d).name).join('・');log('失敗：'+n.name+'は「'+names+'」が動いていないと起動しない（30分むだに）','#ffe1e6');say(names+'が先だった……！','pose_startled');
    // 手順書がないときは、失敗して初めてつながりが分かる
    for(const d of miss){let l=document.querySelector(`#wires line[data-k="${d}-${n.id}"]`)||line(node(d),n);l.classList.remove('need');void l.getBBox();l.classList.add('need')}
    render();return}
  G.crew[free]=n.id;G.busy[n.id]={left:n.t,total:n.t,who:free};beep(520);log('開始：'+n.name+'（'+WHO[free]+'）','#dff1ff');render()}
function accrue(){for(const n of NODES)if(n.biz&&!G.up[n.id])G.loss+=n.biz*.5}
function tick(){if(G.over)return;G.hour+=.5;accrue();
  for(const id in G.busy){const b=G.busy[id];b.left-=.5;if(b.left<=0){G.crew[b.who]=null;delete G.busy[id];const n=node(id);
    if(needs(n).includes('check')&&!G.up.check){G.reinf++;G.fails++;shake(n);beep(150,0,'sawtooth');beep(120,.12,'sawtooth');log('再暗号化：'+n.name+'を戻したが、復元元に感染が残っていた（作業がむだに）','#ffd0da');say('戻したそばから、また暗号化……！　先に安全確認だったね','pose_startled');
      let l=document.querySelector(`#wires line[data-k="check-${n.id}"]`)||line(node('check'),n,'safe');l.classList.remove('need');void l.getBBox();l.classList.add('need')}
    else{G.up[id]=true;n.fin=G.hour;up(n)}}}
  render();if(NODES.every(n=>G.up[n.id]))finish()}
function shake(n){const e=document.getElementById('n-'+n.id);e.classList.remove('fail');void e.offsetWidth;e.classList.add('fail')}
function up(n){const m=document.getElementById('map');const r=document.createElement('div');r.className='ringfx';r.style.left=n.x+'px';r.style.top=n.y+'px';m.appendChild(r);setTimeout(()=>r.remove(),520);beep(660);beep(990,.08);
  document.querySelectorAll(`#wires line[data-k$="-${n.id}"],#wires line[data-k^="${n.id}-"]`).forEach(l=>{const [a,b]=l.dataset.k.split('-');if(G.up[a]&&G.up[b])l.classList.add('live')});
  const late=n.rto&&n.fin>n.rto;log('復旧：'+n.name+(n.rto?(late?'（目標 '+n.rto+'時間を超過）':'（目標内）'):''),late?'#fff4d6':'#e3f7ea');
  if(n.id==='check')say('安全確認ができた！　これで安心して戻せるね','pose_fists');else if(n.biz)say(late?n.name+'、戻ったけど目標を過ぎちゃった……':n.name+'、目標内に戻ったよ！','pose_jump')}
function render(){for(const n of NODES){const e=document.getElementById('n-'+n.id);e.classList.toggle('up',!!G.up[n.id]);e.classList.toggle('busy',!!G.busy[n.id]);
    const r=e.querySelector('.rto');if(r)r.classList.toggle('over',!G.up[n.id]&&G.hour>n.rto);
    let bar=e.querySelector('.bar');if(G.busy[n.id]){if(!bar){bar=document.createElement('div');bar.className='bar';bar.innerHTML='<i></i>';e.appendChild(bar)}bar.firstChild.style.width=((1-G.busy[n.id].left/G.busy[n.id].total)*100)+'%'}else if(bar)bar.remove()}
  const h=Math.floor(G.hour),mi=Math.round((G.hour-h)*60);document.getElementById('clock').textContent='停止 '+h+':'+String(mi).padStart(2,'0');document.getElementById('loss').textContent=Math.round(G.loss);crew()}
function log(t,bg){const d=document.createElement('div');d.textContent=t;d.style.background=bg;document.getElementById('log').prepend(d)}
function finish(){G.over=true;clearInterval(tid);const biz=NODES.filter(n=>n.rto);const miss=biz.filter(n=>n.fin>n.rto).length;
  // 最善の損失との差・順番の失敗・目標超過で減点。最善の順番なら100点
  const score=Math.max(0,Math.min(100,Math.round(100-(G.loss-G.best)/Math.max(G.best,4)*60-G.fails*6-miss*8)));const rank=score>=85?'S':score>=65?'A':score>=40?'B':'C';
  if(score>=65){beep(523);beep(659,.07);beep(784,.14);beep(1046,.21)}
  const maxim=G.key==='ransom'?'戻す前に、確かめる、だよ！':'止まったときは、支えてる仕組みから戻すの！';say(maxim,score>=65?'pose_jump':'pose_think');
  const rows=biz.map(n=>`<tr><td>${n.name}</td><td>${n.fin}時間</td><td>${n.rto}時間</td><td class="r" style="color:${n.fin>n.rto?'var(--red)':'var(--green)'}">${n.fin>n.rto?'超過':'目標内'}</td></tr>`).join('');
  try{const k='protoG-best';const b=+localStorage.getItem(k)||0;if(score>b)localStorage.setItem(k,score);G.bestScore=Math.max(b,score)}catch(e){G.bestScore=score}
  setTimeout(()=>modal(`<h2 class="r">復旧完了　評価 <span style="color:var(--pink)">${rank}</span>（${score}点）</h2><div style="font-size:15px;line-height:1.8">${G.scen.title}／業務の停止 ${document.getElementById('clock').textContent.replace('停止 ','')}／業務の損失 ${Math.round(G.loss)}万円（最善 ${G.best}万円）／順番の失敗 ${G.fails}回${G.reinf?'（うち再暗号化 '+G.reinf+'回）':''}</div>
    <table class="rtot"><tr><th>業務</th><th>戻った時刻</th><th>目標復旧時間</th><th></th></tr>${rows}</table>
    <div class="maxim r">${maxim}</div><div style="font-size:13px;color:var(--gray);margin:4px 0 10px">目標復旧時間（RTO）は「この業務は何時間まで止めてよいか」を平時に決めておく値。手順書に依存関係を書いておくと、迷わず最短で戻せる。自己ベスト ${G.bestScore}点</div>${prep()}<div style="display:flex;gap:10px;margin-top:10px"><button id="again">もう一度</button><button id="daily2" class="sub2">今日の一問</button></div>`),600);
  setTimeout(()=>{const b=document.getElementById('again');if(b)b.onclick=()=>start(false);const d=document.getElementById('daily2');if(d)d.onclick=()=>start(true)},700)}
function prep(){return `<div class="prep"><label><input type="checkbox" id="pRun" ${G&&G.runbook?'checked':''}>備え：手順書（システムのつながりと安全確認の線が最初から見える）</label></div>`}
function say(t,pose){document.getElementById('say').textContent=t;if(pose)document.getElementById('hin').src='../../ArtSource/Hinata/gen-20260929/cut/'+pose+'.png'}
function modal(h){document.getElementById('modalBox').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
function beep(f,t=0,type='sine'){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(.13,s);g.gain.exponentialRampToValueAtTime(.001,s+.2);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+.21)}catch(e){}}
function fit(){const a=document.getElementById('app'),s=Math.min(innerWidth/1300,innerHeight/780);a.style.transform='scale('+s+')';a.style.left=Math.max(0,(innerWidth-1280*s)/2)+'px';a.style.top=Math.max(0,(innerHeight-760*s)/2)+'px'}
addEventListener('resize',fit);fit();
modal(`<h2 class="r">復旧の順番（試作・事件）</h2><div style="font-size:15px;line-height:1.9">社内のシステムが止まった。止まる範囲（停電・保存領域の故障・更新トラブル・ランサムウェア）は毎回かわる。<br>システムを押すと、手の空いている人が立ち上げ始める（2人まで同時）。<br>支えている仕組みが動いていないと起動に失敗して30分むだになる。<br>黄色の枠は<b>止まっている間ずっと損失が出る業務</b>。<b>目標復旧時間</b>までに戻そう。<br>ランサムウェアのときは、<b>安全確認</b>の前に戻すと再び暗号化される。</div><div style="margin:12px 0">${prep()}</div><div style="display:flex;gap:10px"><button id="startBtn">復旧を始める</button><button id="dailyBtn" class="sub2">今日の一問</button></div>`);
document.getElementById('startBtn').onclick=()=>start(false);document.getElementById('dailyBtn').onclick=()=>start(true);
// 撮影用（#shot=start / play / play-runbook / ransom / result）。URLに付けたときだけ動く。普段の遊びには影響しない
(function(){const m=location.hash.match(/^#shot=([\w-]+)/);if(!m)return;const st=m[1];if(st==='start')return;rng=seeded(20260930);
  document.getElementById('pRun').checked=st==='play-runbook'||st==='ransom';start(false,st==='ransom'?'ransom':st==='result'?'storage':'power');clearInterval(tid);
  if(st==='result'){for(const n of NODES){G.up[n.id]=true;n.fin=n.rto?(n.id==='acct'?n.rto+1:n.rto-.5):1}G.loss=G.best+6;G.fails=1;G.hour=6;draw();finish();return}
  const first=NODES.find(n=>!G.up[n.id]&&needs(n).every(d=>G.up[d]));if(first)boot(first);G.hour=1;accrue();accrue();for(const id in G.busy)G.busy[id].left=Math.max(.5,G.busy[id].left-.5);
  if(st==='play'){const bad=NODES.find(n=>!G.up[n.id]&&!G.busy[n.id]&&n.need.some(d=>!G.up[d])&&n.biz);if(bad)boot(bad)}
  render()})();
</script>
</body>
