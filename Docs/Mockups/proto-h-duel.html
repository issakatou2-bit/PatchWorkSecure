<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>試作H 脅威の子と対戦</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 試作H（強敵との対決）：10大脅威の子が技を予告する。技の「攻撃の糸口」に合う備えで受け止める（旧版のパリィの考え方）。
   糸口と対策の基本はIPA「情報セキュリティ10大脅威 2026」解説書［組織編］の表1.2、技はOpsThreatCatalog（Next-20）のまま */
:root{--pink:#ff6f91;--pinkd:#d94a70;--navy:#1d2a44;--blue:#3fa9f5;--red:#e0405f;--green:#2bb673;--gray:#6b7894;--gold:#ffc02e;--rc:#D7263D;--rct:#fff;--rcd:#8a1626}
*{box-sizing:border-box}
body{margin:0;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--navy);background:#1d2a44;min-height:100vh;overflow:hidden}
.r{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800}
#app{width:1280px;height:760px;position:absolute;left:0;top:0;transform-origin:0 0;background:radial-gradient(ellipse at 78% 38%,color-mix(in srgb,var(--rc) 38%,transparent),transparent 60%),linear-gradient(160deg,#1d2a44,#26324f);overflow:hidden}
#app::before{content:'';position:absolute;inset:-50%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 46px),repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 46px);animation:grid 40s linear infinite;pointer-events:none}
@keyframes grid{to{transform:translate(65px,0)}}
.scr{position:absolute;inset:0;display:none}.scr.on{display:block}
.panel{background:rgba(255,255,255,.95);border-radius:22px;box-shadow:0 0 0 3px #fff,0 12px 30px rgba(0,0,0,.3)}
.top{position:absolute;left:16px;right:16px;top:12px;height:68px;display:flex;align-items:center;gap:14px;padding:0 18px}
.badge{background:var(--rc);color:var(--rct);border-radius:16px;padding:6px 16px;font-size:22px;box-shadow:0 5px 0 var(--rcd);white-space:nowrap}
.badge.pk{background:linear-gradient(180deg,#ff8fab,var(--pink));color:#fff;box-shadow:0 5px 0 var(--pinkd)}
.sub{font-size:13px;color:var(--gray)}
.btn{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;border:0;border-radius:18px;cursor:pointer;font-size:19px;padding:12px 18px;color:#fff;background:linear-gradient(180deg,#5fd39b,var(--green));box-shadow:0 5px 0 #1d8a55;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d8a55}
.btn.bl{background:linear-gradient(180deg,#7fc4ff,var(--blue));box-shadow:0 5px 0 #1f7fc4}
.btn.gr{background:linear-gradient(180deg,#a9b4c8,#7d89a3);box-shadow:0 5px 0 #5b6680}
.btn.pk{background:linear-gradient(180deg,#ff8fab,var(--pink));box-shadow:0 5px 0 var(--pinkd)}
.btn:disabled{filter:grayscale(1);opacity:.45;cursor:default}
.vchip{display:inline-flex;align-items:center;gap:5px;background:var(--v);color:#fff;border-radius:10px;padding:3px 10px 3px 6px;font-size:14px;white-space:nowrap;vertical-align:middle}
.vchip.q{background:#6b7894;padding:3px 10px}
.wchip{display:inline-block;background:#f1f4f9;border:2px solid #dfe5ef;border-radius:10px;padding:2px 9px;font-size:13px;margin:2px 3px 2px 0}
.say{position:relative;background:#fff;border-radius:16px;padding:10px 14px;font-size:15px;font-weight:700;line-height:1.55;box-shadow:0 0 0 3px #ffd3de}
.say .who{position:absolute;left:12px;top:-12px;background:var(--pink);color:#fff;border-radius:8px;padding:0 8px;font-size:12px}
.hin{position:absolute;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));pointer-events:none}
.mark{filter:drop-shadow(0 0 2.5px var(--mc))}

/* 相手を選ぶ */
#grid{position:absolute;left:16px;top:96px;width:1248px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.rcard{position:relative;height:292px;border-radius:20px;background:#fff;cursor:pointer;overflow:hidden;box-shadow:0 0 0 3px #fff,0 6px 0 color-mix(in srgb,var(--c) 70%,#000),0 12px 22px rgba(0,0,0,.3);transition:transform .15s}
.rcard:hover{transform:translateY(-4px)}
.rcard::before{content:'';position:absolute;left:0;right:0;top:0;height:196px;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--c) 40%,#fff),color-mix(in srgb,var(--c) 12%,#fff) 70%)}
.rcard .mini{position:absolute;left:50%;top:6px;width:160px;height:192px;transform:translateX(-50%)}
.rcard .mini svg{width:100%;height:100%}
.rcard .nm{position:absolute;left:0;right:0;top:200px;text-align:center;font-size:21px}
.rcard .nm small{font-size:12px;color:var(--gray)}
.rcard .ipa{position:absolute;left:10px;right:10px;top:232px;text-align:center;font-size:12px;line-height:1.4;color:var(--gray)}
.rcard .best{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:12px;background:var(--pink);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--pinkd)}
.rcard .stripe{position:absolute;left:0;right:0;top:192px;height:5px;background:var(--c)}
.selfoot{position:absolute;left:16px;right:16px;top:704px;height:44px;display:flex;align-items:center;gap:14px;color:#cfd8ea;font-size:13px}

/* 準備 */
.pleft{position:absolute;left:16px;top:92px;width:396px;height:652px;overflow:hidden}
.pleft::before{content:'';position:absolute;left:0;right:0;top:0;height:380px;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--rc) 45%,#fff),color-mix(in srgb,var(--rc) 10%,#fff) 72%);border-radius:22px 22px 0 0}
.pport{position:absolute;left:48px;top:10px;width:300px;height:360px}
.pport svg{width:100%;height:100%}
.pname{position:absolute;left:0;right:0;top:384px;text-align:center;font-size:30px}
.pname small{font-size:14px;color:var(--gray)}
.pipa{position:absolute;left:18px;right:18px;top:426px;text-align:center;font-size:14px;color:var(--gray)}
.pintro{position:absolute;left:18px;right:18px;top:470px;box-shadow:0 0 0 3px color-mix(in srgb,var(--rc) 45%,#fff)}
.pintro .who{background:var(--rc);color:var(--rct)}
.pmotif{position:absolute;left:18px;right:18px;bottom:14px;font-size:12px;color:var(--gray);line-height:1.5}
.pright{position:absolute;left:428px;top:92px;width:836px;height:652px;padding:16px 20px}
.pright h3{margin:0 0 6px;font-size:17px;display:flex;align-items:center;gap:8px}
.pright h3 .sub{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500}
.trow{display:grid;grid-template-columns:232px 236px 1fr;gap:10px;align-items:center;padding:5px 8px;border-radius:10px;background:#f6f8fc;margin-bottom:4px}
.trow .tn{font-size:15px}.trow .ts{font-size:12px;color:var(--gray);line-height:1.45}
.note{font-size:12px;color:#8a5a00;background:#fff4d6;border-radius:10px;padding:5px 10px;margin:6px 0;line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opt{position:relative;border-radius:14px;border:3px solid #e3e8f1;background:#fff;padding:7px 8px 18px;cursor:pointer;min-height:96px;transition:transform .1s}
.opt:hover{transform:translateY(-2px)}
.opt .oi{width:30px;height:30px;border-radius:9px;background:var(--v);display:flex;align-items:center;justify-content:center}
.opt .on{font-size:13px;margin-top:4px;line-height:1.3}
.opt .ob{font-size:11px;color:var(--gray);line-height:1.35;margin-top:2px}
.opt.sel{border-color:var(--pink);background:#fff0f4;box-shadow:0 0 0 2px var(--pink)}
.opt.sel::after{content:'持っていく';position:absolute;right:6px;top:6px;font-family:'M PLUS Rounded 1c';font-weight:800;font-size:11px;background:var(--pink);color:#fff;border-radius:6px;padding:0 6px}
.opt .wk{position:absolute;right:6px;bottom:6px;font-size:10px;background:var(--rc);color:var(--rct);border-radius:6px;padding:0 5px}
.pbar{position:absolute;left:20px;right:20px;bottom:16px;display:flex;align-items:center;gap:10px}
.seg{display:flex;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px #dfe5ef}
.seg button{border:0;background:#fff;font-family:'M PLUS Rounded 1c';font-weight:800;font-size:14px;padding:8px 12px;cursor:pointer;color:var(--gray)}
.seg button.on{background:var(--navy);color:#fff}
.tog{font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}

/* 対戦 */
.pips{display:flex;gap:6px;align-items:center}
.pips i{width:30px;height:12px;border-radius:6px;background:#e3e8f1;display:block;position:relative}
.pips i.ok{background:var(--green)}.pips i.ng{background:var(--red)}.pips i.now{background:var(--gold);box-shadow:0 0 0 2px #fff,0 0 8px var(--gold)}
.pips i.fin::after{content:'本気';position:absolute;top:13px;left:0;right:0;text-align:center;font-family:'M PLUS Rounded 1c';font-weight:800;font-size:10px;color:var(--red)}
.mode{font-size:14px;background:#eef3ff;color:#2a5bb8;border-radius:10px;padding:3px 10px;white-space:nowrap}
.dleft{position:absolute;left:16px;top:92px;width:316px;height:652px;padding:16px}
.gauge{margin-bottom:12px}
.gauge .gl{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.gauge .gl b{font-size:22px}
.gauge .gb{height:18px;border-radius:9px;background:#e9edf5;overflow:hidden;position:relative;margin-top:3px;box-shadow:inset 0 2px 3px rgba(0,0,0,.1)}
.gauge .gb i{display:block;height:100%;border-radius:9px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.gauge .gb::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 2px),rgba(255,255,255,.9) calc(20% - 2px) 20%)}
.gauge.dmg .gb i{background:linear-gradient(90deg,#ff9a6b,#e0405f)}
.gauge.stop .gb i{background:linear-gradient(90deg,#b58cff,#6a4bd1)}
.gauge.pulse .gb{animation:gp .5s 2}
@keyframes gp{50%{box-shadow:0 0 0 3px var(--red)}}
.layers h4{margin:6px 0 4px;font-size:14px}
.layers .ly{display:flex;align-items:center;gap:6px;font-size:13px;background:#f3f6fb;border-radius:9px;padding:4px 8px;margin-bottom:4px}
.layers .ly.none{color:var(--gray)}
.dleft .say{position:absolute;left:14px;right:14px;top:296px;min-height:76px;font-size:14px}
.dleft .hin{left:52px;bottom:0;height:240px}
.stage{position:absolute;left:348px;top:92px;width:916px;height:404px}
.port{position:absolute;right:6px;top:-6px;width:330px;height:396px;transition:transform .2s}
.port svg{width:100%;height:100%}
.port.hurt{animation:hurt .5s}
@keyframes hurt{20%{transform:translateX(14px) rotate(3deg)}45%{transform:translateX(-10px) rotate(-2deg)}70%{transform:translateX(5px)}}
.port.gloat{animation:gloat .6s}
@keyframes gloat{30%{transform:translateY(-16px) scale(1.04)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
.port .float{animation:fl 3.2s ease-in-out infinite;width:100%;height:100%}
@keyframes fl{50%{transform:translateY(-8px)}}
.rname{position:absolute;right:30px;top:368px;background:var(--rc);color:var(--rct);border-radius:12px;padding:3px 14px;font-size:18px;box-shadow:0 4px 0 var(--rcd)}
.ann{position:absolute;left:0;top:14px;width:560px;padding:18px 20px 16px;border-radius:22px;background:#fff;box-shadow:0 0 0 4px var(--rc),0 14px 30px rgba(0,0,0,.35)}
.ann .lab{position:absolute;left:18px;top:-15px;background:var(--rc);color:var(--rct);border-radius:9px;padding:1px 12px;font-size:14px}
.ann .lab.fin{background:var(--red);color:#fff;animation:fpulse .8s infinite}
@keyframes fpulse{50%{box-shadow:0 0 12px var(--red)}}
.ann .tline{font-size:17px;font-weight:700;line-height:1.6;min-height:56px}
.ann .tname{font-size:27px;margin:8px 0 6px;line-height:1.25}
.ann .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ann .row .sub{font-size:12px}
.ann .ts{font-size:13px;color:var(--gray);line-height:1.55;margin-top:8px;background:#f6f8fc;border-radius:10px;padding:6px 10px;display:none}
.ann .ts.on{display:block}
.ann .more{border:0;background:none;color:#2a5bb8;font-size:13px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:0}
.ann.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.tbar{height:8px;border-radius:4px;background:#e9edf5;overflow:hidden;margin-top:10px}.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .1s linear}
.banner{position:absolute;left:40px;top:250px;width:520px;text-align:center;font-size:44px;color:#fff;-webkit-text-stroke:2px rgba(0,0,0,.15);text-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:none;opacity:0}
.banner.ok{color:#fff;animation:ban 1.3s ease-out forwards}.banner.ok span{background:linear-gradient(180deg,#5fd39b,var(--green));border-radius:18px;padding:4px 22px;box-shadow:0 6px 0 #1d8a55}
.banner.ng{animation:ban 1.3s ease-out forwards}.banner.ng span{background:linear-gradient(180deg,#ff8a9e,var(--red));border-radius:18px;padding:4px 22px;box-shadow:0 6px 0 #a3243d}
.banner small{display:block;font-size:16px;margin-top:12px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.5);-webkit-text-stroke:0}
.banner.stay{animation:none;opacity:1}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.shield{position:absolute;left:300px;top:250px;width:10px;height:10px;border-radius:50%;border:6px solid #5fd39b;transform:translate(-50%,-50%);pointer-events:none;animation:sh .6s ease-out forwards}
@keyframes sh{0%{width:20px;height:20px;opacity:1}100%{width:420px;height:420px;opacity:0;border-width:2px}}
.flash{position:absolute;inset:0;background:radial-gradient(circle,transparent 40%,rgba(224,64,95,.5));pointer-events:none;animation:fla .6s ease-out forwards;z-index:20}
@keyframes fla{0%{opacity:1}100%{opacity:0}}
.shake{animation:shk .4s}
@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
.rsay{position:absolute;right:300px;top:300px;max-width:260px;background:#fff;border-radius:14px;padding:6px 12px;font-size:15px;font-weight:700;box-shadow:0 0 0 3px var(--rc);opacity:0;pointer-events:none}
.rsay.on{animation:rs 1.4s ease-out forwards}.rsay.stay{opacity:1;animation:none}
@keyframes rs{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.hand{position:absolute;left:348px;top:508px;width:916px;height:236px;padding:12px 16px;display:flex;gap:12px;align-items:stretch}
.card{position:relative;flex:0 0 206px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;border:0;border-radius:18px;background:#fff;cursor:pointer;text-align:left;padding:12px 14px;font-family:inherit;color:var(--navy);box-shadow:0 0 0 3px var(--v),0 7px 0 color-mix(in srgb,var(--v) 65%,#000);transition:transform .12s}
.card:hover{transform:translateY(-6px)}
.card:disabled{cursor:default;transform:none}
.card .key{position:absolute;right:10px;top:8px;width:22px;height:22px;border-radius:6px;background:#eef1f6;color:var(--gray);font-size:13px;display:flex;align-items:center;justify-content:center}
.card .ic{width:50px;height:50px;border-radius:14px;background:var(--v);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 color-mix(in srgb,var(--v) 65%,#000)}
.card .cn{display:block;font-size:17px;margin-top:10px;line-height:1.3}
.card .cb{display:block;font-size:12px;color:var(--gray);margin-top:6px;line-height:1.45}
.card .cv{display:block;font-size:12px;margin-top:4px;color:var(--v);font-weight:700}
.card .wk{position:absolute;right:10px;bottom:10px;font-size:11px;background:var(--rc);color:var(--rct);border-radius:6px;padding:0 6px}
.card.used{animation:use .5s ease-out}
@keyframes use{40%{transform:translateY(-30px) scale(1.06)}}
.card.right{box-shadow:0 0 0 4px var(--green),0 0 18px var(--green),0 7px 0 #1d8a55}
.hside{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:flex-end}
.hside .btn{font-size:16px;padding:10px 12px}
.hside .left{font-size:12px;color:#cfd8ea;text-align:center}
.hand .empty{color:#cfd8ea;font-size:14px;align-self:center}

/* 結果 */
.modal{position:absolute;inset:0;background:rgba(10,15,30,.6);display:none;align-items:center;justify-content:center;z-index:30}
.modal.on{display:flex}.modal .box{width:920px;max-height:740px;overflow:auto;padding:16px 24px}
.res{display:flex;align-items:center;gap:16px}
.res .rk{width:64px;height:64px;border-radius:20px;background:var(--pink);color:#fff;font-size:46px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--pinkd)}
.res .rk.lose{background:#7d89a3;box-shadow:0 5px 0 #5b6680;font-size:22px;line-height:1.1;text-align:center}
.res h2{margin:0;font-size:28px}
.rline{display:flex;align-items:center;gap:12px;margin:6px 0}
.rline .mini{width:62px;height:74px;flex:0 0 62px}.rline .mini svg{width:100%;height:100%}
.rline .say{flex:1;box-shadow:0 0 0 3px var(--rc)}.rline .say .who{background:var(--rc);color:var(--rct)}
.rtab{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0}
.rtab .vchip{font-size:12px;padding:1px 8px 1px 5px}
.rtab th{white-space:nowrap;text-align:left;color:var(--gray);font-weight:700;border-bottom:2px solid #e6ebf3;padding:4px}
.rtab td{padding:3px 4px;line-height:1.35;border-bottom:1px solid #eef1f6;vertical-align:middle}
.rtab tr.ng td{background:#fff3f5}
.ok-t{color:var(--green)}.ng-t{color:var(--red)}
.foot{font-size:11px;color:var(--gray);line-height:1.5;margin-top:4px}
.maxim{font-size:17px;color:var(--pinkd);background:#fff0f4;border-radius:14px;padding:5px 14px;margin:6px 0;text-align:center}
.modal .wchip{font-size:12px;padding:1px 8px}
.modal .btn{font-size:17px;padding:10px 16px}
</style>
</head>
<body>
<div id="app">
  <!-- 相手を選ぶ -->
  <div class="scr" id="scrSelect">
    <div class="top panel"><div class="badge pk r">対戦（試作）</div><div style="flex:1;font-size:15px;line-height:1.5">脅威の子が技を予告する。技の<b>攻撃の糸口</b>に合う<b>備え</b>で受け止めよう。<span class="sub">名前はすべて仮。「情報セキュリティ10大脅威 2026」［組織編］を元にした</span></div><button class="btn bl" id="dailyBtn">今日の一問</button></div>
    <div id="grid"></div>
    <div class="selfoot"><span>相手を押すと、技と弱点を確かめて、持っていく備えを選ぶ画面へ。右上の文字はその子に勝ったときの最高の評価（このブラウザだけに保存）。</span></div>
  </div>
  <!-- 準備 -->
  <div class="scr" id="scrPrep">
    <div class="top panel"><div class="badge r" id="pBadge">対戦の準備</div><div style="flex:1;font-size:15px" id="pHead"></div><button class="btn gr" id="backBtn">相手を選ぶ</button></div>
    <div class="pleft panel"><div class="pport" id="pPort"></div><div class="pname r" id="pName"></div><div class="pipa" id="pIpa"></div><div class="say pintro" id="pIntro"></div><div class="pmotif" id="pMotif"></div></div>
    <div class="pright panel">
      <h3 class="r">この子の技 <span class="sub" id="techSub"></span></h3><div id="techList"></div><div id="pNote"></div>
      <h3 class="r" style="margin-top:8px">持っていく備え <span class="sub" id="loadSub"></span></h3><div class="opts" id="opts"></div>
      <div class="pbar"><div class="seg" id="modeSeg"><button data-m="easy">はじめて（糸口を見せる）</button><button data-m="hard">腕だめし（糸口を隠す）</button></div><label class="tog"><input type="checkbox" id="pTimer">制限時間</label><div style="flex:1"></div><button class="btn" id="goBtn">対戦する</button></div>
    </div>
  </div>
  <!-- 対戦 -->

 const b=$('banner');b.className='banner r';void b.offsetWidth;
 if(h.ok){b.innerHTML=`<span>受け止めた！</span><small>糸口「${vname(h.t.v)}」に「${EQ[id].name}」</small>`;b.classList.add('ok');
  const s=document.createElement('div');s.className='shield';$('stage').appendChild(s);setTimeout(()=>s.remove(),650);
  port('hurt');rsay(G.r.ouch);beep(660);beep(990,.07);if(G.combo>=3)beep(1320,.14);
  say(COMBO[Math.min(G.combo,COMBO.length)-1],G.combo>=3?'pose_jump':'pose_fists')}
 else{b.innerHTML=`<span>${h.g==='stop'?'停止':'被害'} +${h.amt}</span><small>${timeout?'時間切れ。':id?'糸口に合わなかった。':'見送った。'}受け止められたのは「${EQ[need(h.t)].name}」</small>`;b.classList.add('ng');
  if(right)right.classList.add('right');
  const f=document.createElement('div');f.className='flash';$('app').appendChild(f);setTimeout(()=>f.remove(),650);
  const st=$('scrDuel');st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake');
  const gg=$(h.g==='stop'?'gStop':'gDmg');gg.classList.remove('pulse');void gg.offsetWidth;gg.classList.add('pulse');
  port('gloat');rsay(G.r.laugh);beep(180,0,'sawtooth');beep(140,.12,'sawtooth');
  const has=G.load.includes(need(h.t));
  say(`大丈夫！　この技の糸口は「${vname(h.t.v)}」。`+(has?`次は「${EQ[need(h.t)].name}」で受けよう！`:`「${EQ[need(h.t)].name}」があれば受け止められたよ。`),'pose_startled')}
 if(SHOT){b.classList.add('stay');$('rsay').classList.add('stay');return}
 setTimeout(advance,1500)}
function advance(){if(G.dmg>=LIMIT||G.stop>=LIMIT)return finish(false);G.turn++;if(G.turn>=TURNS)return finish(true);port('');nextTurn()}
function port(cls){const p=$('dPort');p.classList.remove('hurt','gloat');void p.offsetWidth;if(cls)p.classList.add(cls);p.innerHTML='<div class="float">'+portrait(G.r,cls==='hurt'?'hurt':cls==='gloat'?'smug':'')+'</div>'}
function rsay(t){const e=$('rsay');e.textContent=t;e.classList.remove('on');void e.offsetWidth;e.classList.add('on')}
function startTimer(){stopTimer();if(!G.timer||SHOT)return;G.t=TIME[G.mode];tid=setInterval(()=>{if(G.lock)return;G.t=Math.max(0,G.t-.1);const b=$('tbar');if(b)b.style.width=(G.t/TIME[G.mode]*100)+'%';if(G.t<=0)play(null,null,true)},100)}
function stopTimer(){clearInterval(tid);tid=null}
function finish(win){G.over=true;G.lock=true;stopTimer();renderPips();const r=G.r,blocks=G.hist.filter(h=>h.ok).length;
 const rank=win?(blocks>=5?'S':blocks>=4?'A':blocks>=2?'B':'C'):null;if(rank)saveBest(r.id,rank);
 const used=[...new Set(G.hist.filter(h=>h.ok).map(h=>h.id))],layers=G.load.filter(id=>r.weak.includes(id));
 const missing=[...new Set(G.hist.filter(h=>!h.ok).map(h=>need(h.t)))].filter(id=>!G.load.includes(id));
 if(win){beep(523);beep(659,.08);beep(784,.16);beep(1046,.24)}else{beep(392,0,'triangle');beep(330,.15,'triangle')}
 say(win?r.name+'の手口、ちゃんと受け止められたね！':'大丈夫。どの備えなら受け止められたか、一緒に見てみよう！',win?'pose_jump':'pose_please');
 const rows=G.hist.map((h,i)=>`<tr class="${h.ok?'':'ng'}"><td>${i+1}${h.fin?'<br><span class="ng-t r" style="font-size:11px">本気</span>':''}</td><td><b>${h.t.n}</b></td><td>${vchip(h.t.v)}</td><td>${h.id?EQ[h.id].name:h.timeout?'時間切れ':'見送り'}</td><td class="r ${h.ok?'ok-t':'ng-t'}" style="white-space:nowrap">${h.ok?'受け止めた':(h.g==='stop'?'停止':'被害')+' +'+h.amt}</td><td>${EQ[need(h.t)].name}<span class="sub">（${VEC[h.t.v].basic}）</span></td></tr>`).join('');
 const chips=a=>a.map(id=>`<span class="wchip">${EQ[id].name}</span>`).join('');
 modal(`<div class="res">${win?`<div class="rk r">${rank}</div>`:'<div class="rk lose r">また<br>挑戦</div>'}<div><h2 class="r">${win?r.name+'に勝った！':r.name+'に押し切られた'}</h2><div class="sub">受け止めた ${blocks} / ${TURNS}　被害 ${G.dmg}　停止 ${G.stop}（どちらかが${LIMIT}になると負け）${G.daily?'　今日の一問':''}</div></div></div>
 <div class="rline"><div class="mini">${portrait(r,win?'hurt':'smug')}</div><div class="say"><span class="who r">${r.name}</span>${win?r.lose:r.win}</div></div>
 ${win?`<div style="font-size:14px">効いた備え：${used.length?chips(used):'<span class="sub">（受け止めた技はなし）</span>'}${layers.length?'　重ねた弱点：'+chips(layers):''}</div>`:`<div style="font-size:14px">${missing.length?'次は、これを持っていこう：'+chips(missing):'持っていた備えで受け止められた技もあったよ。糸口をもう一度見てみよう。'}${layers.length?'　重ねた弱点：'+chips(layers):''}</div>`}
 <table class="rtab"><tr><th>ターン</th><th>技</th><th>攻撃の糸口</th><th>選んだ備え</th><th>結果</th><th>受け止められた備え（対策の基本）</th></tr>${rows}</table>
 <div style="font-size:13px">${r.name}の弱点（効く備え）：${chips(r.weak)}</div>
 <div class="maxim r">${win?'手口を知って、合う備えを選ぶ。それが一番の近道だよ！':'押し切られても、だいじょうぶ。どこで受け止められたかが分かれば、次は強くなれる！'}</div>
 <div class="foot">「受け止めた」はゲーム上の整理。現実では一つの備えで必ず防げるわけではなく、いくつも重ねて被害を抑える。攻撃の糸口と対策の基本はIPA「情報セキュリティ10大脅威 2026」解説書［組織編］の表1.2、技の説明は同解説書の要約（OpsThreatCatalog、確認日2026-10-03）。糸口への割り当てと設備との対応はゲーム用の整理。数値は実測ではない。</div>
 <div style="display:flex;gap:10px;margin-top:10px"><button class="btn" id="againBtn">もう一度（同じ備え）</button><button class="btn bl" id="prepBtn">備えを選び直す</button><button class="btn gr" id="selBtn">相手を選ぶ</button></div>`);
 $('againBtn').onclick=()=>{closeModal();P.load=G.load.slice();start()};$('prepBtn').onclick=()=>{const keep=G.load.slice();showPrep(P.r,P.daily);P.load=keep;renderPrep()};$('selBtn').onclick=showSelect}
function daily(){const rr=seeded(dayNum()+11);showPrep(Math.floor(rr()*RIVALS.length),true)}
function say(t,pose){$('sayT').textContent=t;if(pose)$('hin').src=HIN+pose+'.png'}
function modal(h){$('modalBox').innerHTML=h;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
function beep(f,t=0,type='sine'){if(SHOT)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(.12,s);g.gain.exponentialRampToValueAtTime(.001,s+.2);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+.21)}catch(e){}}
function fit(){const a=$('app'),s=Math.min(innerWidth/1300,innerHeight/780);a.style.transform='scale('+s+')';a.style.left=Math.max(0,(innerWidth-1280*s)/2)+'px';a.style.top=Math.max(0,(innerHeight-760*s)/2)+'px'}
addEventListener('resize',fit);fit();
addEventListener('keydown',e=>{if(!G||G.lock||!$('scrDuel').classList.contains('on'))return;const cards=G.load.filter(id=>EQ[id].vec);const n=+e.key;if(n>=1&&n<=cards.length)play(cards[n-1]);else if(e.key==='c'||e.key==='C')consult();else if(e.key==='x'||e.key==='X')play(null)});
$('dailyBtn').onclick=daily;$('backBtn').onclick=showSelect;$('goBtn').onclick=()=>{if(P.load.length===SLOTS)start()};
showSelect();
// 撮影用（#shot=select / prep / prep-hard / duel / hidden / block / hit / win / lose。末尾に -2 などを付けると、その順の相手）。URLに付けたときだけ動く。普段の遊びには影響しない
(function(){const m=location.hash.match(/^#shot=([a-z]+(?:-hard)?)(?:-(\d+))?/);if(!m)return;SHOT=true;const st=m[1],i=Math.max(0,Math.min(9,(+m[2]||1)-1)),r=RIVALS[i];
 // 撮影では、受け止められる備え（糸口ごとに1つ）を先に入れ、空きに弱点の重ねる備えを入れる
 const right=[...new Set(r.tech.map(t=>VEC[t.v].eq))],extra=r.weak.filter(id=>!right.includes(id));const best=right.concat(extra).slice(0,SLOTS);
 if(st==='select'){showSelect();return}
 P.mode=(st==='prep-hard'||st==='hidden')?'hard':'easy';showPrep(i,false);P.mode=(st==='prep-hard'||st==='hidden')?'hard':'easy';
 if(st==='prep'||st==='prep-hard'){P.load=st==='prep'?best.slice(0,2):[];renderPrep();return}
 P.load=best;start();
 if(st==='duel'||st==='hidden'){if(G.timer){const b=$('ann').querySelector('.tbar');if(b)b.firstChild.style.width='72%'}return}
 if(st==='block'){play(need(cur()));return}
 if(st==='hit'){const wrong=G.load.find(id=>EQ[id].vec&&id!==need(cur()));if(wrong)play(wrong);else play(null);return}
 // 勝ち：4回受け止めて1回外す。負け：備えが合わないまま押し切られる
 SHOT=false;const fakeBeep=beep;beep=()=>{};
 if(st==='win'){for(let k=0;k<TURNS;k++){G.lock=false;resolve(k===2?null:need(cur()));G.turn++}G.turn=TURNS-1;renderSide();finish(true)}
 if(st==='lose'){const by={stop:[],dmg:[]};r.tech.forEach((t,k)=>by[gaugeOf(t)].push(k));const pick=by.stop.length>=by.dmg.length?by.stop:by.dmg;
  G.seq=Array.from({length:TURNS},(_,k)=>pick[k%pick.length]);G.load=BASICS.filter(id=>!right.includes(id)&&!r.weak.includes(id)).slice(0,SLOTS);renderHand();
  while(G.dmg<LIMIT&&G.stop<LIMIT&&G.turn<TURNS){resolve(G.load[0]||null);if(G.dmg>=LIMIT||G.stop>=LIMIT)break;G.turn++}renderSide();finish(false)}
 beep=fakeBeep;SHOT=true})();
</script>
