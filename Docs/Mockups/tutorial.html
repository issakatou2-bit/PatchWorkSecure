<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>最初の1か月 チュートリアル</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&amp;family=Zen+Kaku+Gothic+New:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Zen Kaku Gothic New',sans-serif;color:#1d2a44}
.r{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800}
.en{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:12px;letter-spacing:.32em}
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:18px;height:54px;border-radius:17px;padding:0 24px}
.pink{color:#ffffff;background:linear-gradient(180deg,#ff94ae 0%,#ff6f91 55%,#f45a80 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 6px 0 #c9486c,0 10px 18px rgba(201,72,108,.35);text-shadow:0 2px 0 rgba(160,40,80,.45)}
.gloss{position:absolute;left:8px;right:8px;top:4px;height:40%;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0))}
@keyframes spot{0%,100%{box-shadow:0 0 0 3000px rgba(15,20,40,.62),0 0 0 4px #ffd23f,0 0 26px 8px rgba(255,210,63,.8)}50%{box-shadow:0 0 0 3000px rgba(15,20,40,.62),0 0 0 4px #ffd23f,0 0 8px 2px rgba(255,210,63,.4)}}
@keyframes point{0%,100%{transform:translate(0,0) rotate(-20deg)}50%{transform:translate(10px,14px) rotate(-20deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
<div style="position: relative; width: 1600px; height: 900px; overflow: hidden">
<img src="../../Artifacts/CompanyOps/42-compact-planning.png" alt="計画画面（Unityの実画面）" style="position: absolute; left: 0; top: 0; width: 1600px; height: 900px">
<div style="position: absolute; left: 652px; top: 732px; width: 180px; height: 158px; border-radius: 22px; animation: spot 1.6s ease-in-out infinite"></div>
<svg style="position: absolute; left: 800px; top: 640px; animation: point 1s ease-in-out infinite" width="80" height="80" viewBox="0 0 24 24" fill="#ffd23f" stroke="#7a5a00" stroke-width="1.2" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10l4.6.8a2 2 0 0 1 1.6 2.3l-.9 5A2 2 0 0 1 15.3 20H10a2 2 0 0 1-1.6-.8l-3.2-4.3a1.5 1.5 0 0 1 2.2-2L9 14z"></path></svg>

<img src="../../Assets/Sprites/Hinata/hinata_normal.png" alt="ひなた" style="position: absolute; left: -30px; top: 330px; width: 560px; height: 560px; animation: bob 3s ease-in-out infinite">
<div style="position: absolute; left: 400px; top: 400px; width: 560px; border-radius: 26px; background: linear-gradient(180deg, #ffffff, #f6f8fc); box-shadow: 0 0 0 3px #ffffff, 0 0 0 5px #ffc4d3, 0 18px 40px rgba(0,0,0,.35); padding: 22px 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 10px">
    <span class="r" style="background: #ff6f91; color: #ffffff; font-size: 14px; border-radius: 10px; padding: 3px 12px">ひなた</span>
    <span class="en" style="color: #ff6f91">TUTORIAL</span>
    <span style="margin-left: auto; display: flex; gap: 6px">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #ff6f91"></span>
      <span style="width: 26px; height: 10px; border-radius: 5px; background: #ff6f91"></span>
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #dfe5f0"></span>
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #dfe5f0"></span>
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #dfe5f0"></span>
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #dfe5f0"></span>
    </span>
  </div>
  <p style="margin: 0; font-size: 22px; line-height: 1.6; font-weight: 700">まずは<span class="r" style="color: #1f6fb0">「調べる」</span>を押してみて！<br>会社の今の状態が分かると、<br>事件のときの見積もりが正確になるよ。</p>
  <div style="display: flex; align-items: center; gap: 10px; border-radius: 14px; background: #fff6d6; padding: 10px 14px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#b07d00" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v5h1"></path></svg>
    <span style="font-size: 15px; color: #5c4000">行動には「工数」を使うよ。1か月に4回まで。</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px">
    <button class="r" style="border: 0; background: transparent; color: #7c879c; font-size: 15px; cursor: pointer">説明を飛ばす</button>
    <span style="margin-left: auto; font-size: 14px; color: #7c879c">光っているボタンを押すと次へ進む</span>
  </div>
</div>

<div style="position: absolute; left: 400px; top: 60px; width: 800px; border-radius: 22px; background: rgba(255,255,255,.96); box-shadow: 0 0 0 3px #ffffff, 0 12px 30px rgba(0,0,0,.3); padding: 16px 22px; box-sizing: border-box; display: flex; align-items: center; gap: 16px">
  <span class="r" style="width: 48px; height: 48px; border-radius: 24px; background: #ff6f91; color: #ffffff; font-size: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">2</span>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <span class="en" style="color: #ff6f91">STEP 2 / 6</span>
    <span class="r" style="font-size: 22px">行動を選んで、会社の力を育てよう</span>
  </div>
</div>
</div>
</body>
</html>
